# One-command replay scenario manifest
# Paths are relative to this manifest file unless absolute.

input_csv=tcu_io_trace_input_sample.csv
expected_csv=tcu_io_trace_expected_actuator_wildcard.csv

# Per-scenario tolerances
# This file can also set check_y3/check_y4/check_y5.
tolerance_config=tcu_io_trace_tolerance_profile.cfg

# Wildcard policy for expected CSV: allow|forbid
wildcard_policy=allow

# Default to quiet for CI logs; CLI flags can override.
quiet=1
